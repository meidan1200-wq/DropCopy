plugins {
    id "com.android.application"
}

// Set by the release workflow from the tag (v1.2.3 -> 1.2.3 / 10203); local builds use these.
def appVersionName = (project.findProperty("appVersionName") ?: "0.3.0").toString()
def appVersionCode = (project.findProperty("appVersionCode") ?: "300").toString().toInteger()
// The release key comes from the DROPCOPY_KEYSTORE* secrets in CI. Without it, the debug key signs.
def releaseKeystore = System.getenv("DROPCOPY_KEYSTORE")

android {
    namespace "dev.dropcopy"
    compileSdk 35

    defaultConfig {
        applicationId "dev.dropcopy"
        // Android 10: sharing shortcuts (the PC icon in the share sheet) need it.
        minSdk 29
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("DROPCOPY_KEYSTORE_PASSWORD")
                keyAlias "dropcopy"
                keyPassword System.getenv("DROPCOPY_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // One fixed key, so every update installs over the previous version.
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Point these at a running `dropcopy` receiver to include the live-network tests.
                environment "DROPCOPY_TEST_LINK", System.getenv("DROPCOPY_TEST_LINK") ?: ""
                environment "DROPCOPY_TEST_DIR", System.getenv("DROPCOPY_TEST_DIR") ?: ""
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google's QR scanner UI: runs inside Play services, needs no camera permission.
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
}
