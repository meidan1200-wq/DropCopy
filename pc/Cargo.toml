[package]
name = "dropcopy"
version = "0.4.0"
edition = "2021"
description = "Phone-to-PC drop: share on the phone, Ctrl+V on the PC. LAN only, no cloud."
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dropcopy"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }

# COM and WinRT (drag-and-drop, Bluetooth LE) for the taskbar phone and proximity.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
