name: Release

# Push a tag like v0.1.0 (or run it from the Actions tab with a version) to build the Windows receiver and the Android app
# and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0 (the tag is created if missing)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version
        shell: bash
        run: |
          V="${{ inputs.version || github.ref_name }}"; V="${V#v}"
          sed -i "0,/^version = .*/s//version = \"$V\"/" pc/Cargo.toml
          grep -m1 '^version' pc/Cargo.toml
      - run: cargo test --release
        working-directory: pc
      # Two builds of the same code: the app (no console, nothing flashes on a double-click or at
      # sign-in) and the command-line one for typing commands in a terminal.
      - shell: bash
        working-directory: pc
        run: |
          cargo build --release
          cp target/release/dropcopy.exe dropcopy-cli.exe
          cargo build --release --features gui
          cp target/release/dropcopy.exe dropcopy.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            pc/dropcopy.exe
            pc/dropcopy-cli.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Every release must be signed with the same key, or phones can't update in place.
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.DROPCOPY_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::DROPCOPY_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dropcopy.p12"
          echo "DROPCOPY_KEYSTORE=$RUNNER_TEMP/dropcopy.p12" >> "$GITHUB_ENV"
      # ubuntu-latest ships the Android SDK (ANDROID_HOME is set).
      - name: Build and test
        working-directory: android
        env:
          DROPCOPY_KEYSTORE_PASSWORD: ${{ secrets.DROPCOPY_KEYSTORE_PASSWORD }}
        run: |
          V="${{ inputs.version || github.ref_name }}"; V="${V#v}"
          IFS=. read -r MA MI PA <<< "$V"
          ./gradlew --no-daemon -PappVersionName="$V" -PappVersionCode=$((MA*10000 + MI*100 + PA)) assembleRelease testReleaseUnitTest
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3
      - run: mv android/app/build/outputs/apk/release/app-release.apk DropCopy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: DropCopy.apk

  release:
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # The same program under a name that says what it is; dropcopy.exe stays for the updaters.
      - run: cp dropcopy.exe DropCopy-Setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            DropCopy-Setup.exe
            DropCopy.apk
            dropcopy.exe
            dropcopy-cli.exe
          body: |
            **PC (Windows 10/11):** download `DropCopy-Setup.exe` and double-click it. It installs itself, starts with Windows, runs in the background with an icon in the tray, and updates itself from here on. (`dropcopy.exe` is the same file, used by the built-in updater; `dropcopy-cli.exe` is for typing `dropcopy` commands in a terminal.)
            **Phone (Android 10+):** install `DropCopy.apk`, open it and scan the QR code the PC shows. It updates itself from here on.
            Share a photo to DropCopy and press Ctrl+V on the PC. Hold the phone by your laptop to bring up your newest photo on the little phone above the taskbar, and drag it into any app.
